    <rect x="765" y="248" width="260" height="14" rx="2" fill="#c62828" stroke="#8e0000" stroke-width="1.5" />
    <text x="895" y="259" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">ШИНА-ГРЕБЕНКА 1P (ФАЗА ПОСЛЕ УЗО 2)</text>
    <rect x="777" y="262" width="6" height="23" fill="#c62828" />
    <rect x="832" y="262" width="6" height="23" fill="#c62828" />
    <rect x="887" y="262" width="6" height="23" fill="#c62828" />
    <rect x="942" y="262" width="6" height="23" fill="#c62828" />
    <rect x="997" y="262" width="6" height="23" fill="#c62828" />
  </g>

  <!-- Автомат 1 (Розетки 1) -->
  <g filter="url(#shadow)">
    <rect x="760" y="280" width="40" height="180" rx="4" fill="#eceff1" stroke="#37474f" stroke-width="1.5" />
    <rect x="765" y="355" width="30" height="35" rx="2" fill="#cfd8dc" />
    <rect x="770" y="360" width="20" height="25" rx="1" fill="#37474f" />
    <text x="780" y="325" font-size="9" font-weight="bold" fill="#212121" text-anchor="middle">B16</text>
    <text x="780" y="340" font-size="8" fill="#00796b" text-anchor="middle">Роз 1</text>
    <circle cx="780" cy="295" r="5" fill="#b0bec5" stroke="#37474f" />
    <circle cx="780" cy="445" r="5" fill="#b0bec5" stroke="#37474f" />
  </g>

  <!-- Автомат 2 (Розетки 2) -->
  <g filter="url(#shadow)">
    <rect x="815" y="280" width="40" height="180" rx="4" fill="#eceff1" stroke="#37474f" stroke-width="1.5" />
    <rect x="820" y="355" width="30" height="35" rx="2" fill="#cfd8dc" />
    <rect x="825" y="360" width="20" height="25" rx="1" fill="#37474f" />
    <text x="835" y="325" font-size="9" font-weight="bold" fill="#212121" text-anchor="middle">B16</text>
    <text x="835" y="340" font-size="8" fill="#00796b" text-anchor="middle">Роз 2</text>
    <circle cx="835" cy="295" r="5" fill="#b0bec5" stroke="#37474f" />
    <circle cx="835" cy="445" r="5" fill="#b0bec5" stroke="#37474f" />
  </g>

  <!-- Автомат 3 (Розетки 3) -->
