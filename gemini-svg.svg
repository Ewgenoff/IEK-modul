    <text x="945" y="340" font-size="8" fill="#f57f17" text-anchor="middle">Свет 1</text>
    <circle cx="945" cy="295" r="5" fill="#b0bec5" stroke="#37474f" />
    <circle cx="945" cy="445" r="5" fill="#b0bec5" stroke="#37474f" />
