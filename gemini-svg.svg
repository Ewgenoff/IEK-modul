    <circle cx="420" cy="365" r="5" fill="#f44336" />
    <text x="420" y="380" font-size="7" fill="#212121" text-anchor="middle">T</text>
    <text x="407" y="320" font-size="11" font-weight="bold" fill="#212121" text-anchor="middle">УЗО 1</text>
    <text x="407" y="335" font-size="9" fill="#0277bd" text-anchor="middle">ПЛИТА 30мА</text>
    <circle cx="388" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
    <text x="388" y="287" font-size="9" font-weight="bold" fill="#c62828" text-anchor="middle">L</text>
    <circle cx="426" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
