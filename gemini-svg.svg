    <text x="295" y="275" font-size="8" font-weight="bold" fill="#212121" text-anchor="middle">3 (N)</text>
    <!-- Клемма 2 (L выход) -->
    <circle cx="250" cy="455" r="6" fill="#b0bec5" stroke="#37474f" />
    <text x="250" y="468" font-size="8" font-weight="bold" fill="#212121" text-anchor="middle">2 (L_вых)</text>
  </g>

