    <text x="667" y="320" font-size="11" font-weight="bold" fill="#212121" text-anchor="middle">УЗО 2</text>
    <text x="667" y="335" font-size="9" fill="#0277bd" text-anchor="middle">ГРУППА 30мА</text>
    <circle cx="648" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
    <text x="648" y="287" font-size="9" font-weight="bold" fill="#c62828" text-anchor="middle">L</text>
    <circle cx="686" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
    <text x="686" y="287" font-size="9" font-weight="bold" fill="#1565c0" text-anchor="middle">N</text>
    <circle cx="648" cy="445" r="6" fill="#b0bec5" stroke="#37474f" />
    <circle cx="686" cy="445" r="6" fill="#b0bec5" stroke="#37474f" />
  </g>

  <!-- 6. ГРУППА 5 АВТОМАТОВ 1P С ГРЕБЕНКОЙ (x: 760..1020) -->
  <!-- Шина-гребенка PIN -->
