    <text x="945" y="622" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ИЗОЛИРОВАННАЯ ШИНА N2 (РОЗЕТКИ И СВЕТ)</text>
    <circle cx="780" cy="617" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
