  <!-- ==================== ПРОВОДКА (БЕЗ ПЕРЕСЕЧЕНИЙ) ==================== -->

  <!-- 1. ВВОДНЫЕ КАБЕЛИ -->
  <path d="M 108 130 L 108 295" fill="none" stroke="#d32f2f" stroke-width="4" />
  <text x="100" y="150" fill="#ff5252" font-size="11" font-weight="bold" text-anchor="end">ВВОД ФАЗА (L)</text>

  <path d="M 146 130 L 146 295" fill="none" stroke="#0288d1" stroke-width="4" />
  <text x="154" y="150" fill="#40c4ff" font-size="11" font-weight="bold" text-anchor="start">ВВОД НОЛЬ (N)</text>

  <!-- Ввод PE: Идет по левому краю щита (x=45) напрямую к шине заземления PE -->
  <path d="M 45 130 L 45 762 L 90 762" fill="none" stroke="#fbc02d" stroke-width="4" stroke-dasharray="10, 5" />
  <text x="45" y="115" fill="#ffee58" font-size="11" font-weight="bold" text-anchor="middle">ВВОД PE</text>

  <!-- 2. ВВОДНОЙ 2P -> РН-263t (Вход фазы L_вх) -->
  <!-- Проходит через нижний коридор y=485, поднимается в межмодульном пространстве x=190 и входит в клемму 1 -->
  <path d="M 108 445 L 108 485 L 190 485 L 190 220 L 250 220 L 250 285" fill="none" stroke="#d32f2f" stroke-width="3" />

  <!-- 3. ВВОДНОЙ 2P -> ОБЩАЯ ШИНА N -->
  <!-- Проходит в нижнем коридоре ниже фазы (y=515), поднимается в межмодульном пространстве x=210 и заходит на шину N -->
  <path d="M 146 445 L 146 515 L 210 515 L 210 92 L 310 92" fill="none" stroke="#0288d1" stroke-width="3" />

  <!-- 4. ОБЩАЯ ШИНА N -> РН-263t (Клемма 3, служебный ноль) -->
  <path d="M 340 92 L 340 180 L 295 180 L 295 285" fill="none" stroke="#0288d1" stroke-width="2" />

  <!-- 5. ОБЩАЯ ШИНА N -> УЗО 1 (вход N) -->
  <path d="M 430 92 L 430 295" fill="none" stroke="#0288d1" stroke-width="3" />

  <!-- 6. ОБЩАЯ ШИНА N -> УЗО 2 (вход N) -->
  <path d="M 480 92 L 480 160 L 686 160 L 686 295" fill="none" stroke="#0288d1" stroke-width="3" />

  <!-- 7. ВЫХОД ФАЗЫ С РН-263t (Клемма 2) -> УЗО 1 и УЗО 2 -->
  <!-- Опускается в нижний коридор (y=545), разветвляется в межмодульных промежутках: x=345 (к УЗО 1) и x=600 (к УЗО 2) -->
  <path d="M 250 455 L 250 545 L 345 545 L 345 230 L 388 230 L 388 295" fill="none" stroke="#d32f2f" stroke-width="3" />
  <path d="M 345 545 L 600 545 L 600 230 L 648 230 L 648 295" fill="none" stroke="#d32f2f" stroke-width="3" />
  <circle cx="345" cy="545" r="4.5" fill="#d32f2f" />

  <!-- 8. УЗО 1 (выход L) -> АВТОМАТ ПЛИТЫ 1P (вход L) -->
  <!-- Проходит в межмодульном пространстве x=465, поднимается выше автомата и входит в верхнюю клемму -->
  <path d="M 388 445 L 388 495 L 465 495 L 465 240 L 512 240 L 512 295" fill="none" stroke="#d32f2f" stroke-width="3" />

  <!-- 9. УЗО 2 (выход L) -> ШИНА-ГРЕБЕНКА 1P -->
  <!-- Проходит в коридоре x=735 прямо в торец гребенки -->
  <path d="M 648 445 L 648 495 L 735 495 L 735 255 L 765 255" fill="none" stroke="#d32f2f" stroke-width="3" />

  <!-- 10. УЗО 2 (выход N) -> ИЗОЛИРОВАННАЯ ШИНА N2 -->
  <path d="M 686 445 L 686 617 L 780 617" fill="none" stroke="#0288d1" stroke-width="3" />

  <!-- ==================== ОТХОДЯЩИЕ ЛИНИИ ==================== -->

  <!-- ЛИНИЯ ПЛИТЫ -->
  <path d="M 512 445 L 512 835" fill="none" stroke="#d32f2f" stroke-width="3" />
  <path d="M 426 445 L 426 835" fill="none" stroke="#0288d1" stroke-width="3" />
  <path d="M 480 762 L 480 835" fill="none" stroke="#fbc02d" stroke-width="3" stroke-dasharray="6, 3" />

  <g filter="url(#shadow)">
    <rect x="395" y="835" width="150" height="46" rx="5" fill="#212529" stroke="#90a4ae" stroke-width="1.5" />
    <text x="470" y="863" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ПЛИТА (3х6)</text>
  </g>

  <!-- ЛИНИИ 5 НАГРУЗОК (Розетки 1-3, Свет 1-2) -->
  <!-- Фазы с автоматов -->
  <path d="M 780 445 L 780 835" fill="none" stroke="#d32f2f" stroke-width="2" />
  <path d="M 835 445 L 835 835" fill="none" stroke="#d32f2f" stroke-width="2" />
  <path d="M 890 445 L 890 835" fill="none" stroke="#d32f2f" stroke-width="2" />
  <path d="M 945 445 L 945 835" fill="none" stroke="#d32f2f" stroke-width="2" />
  <path d="M 1000 445 L 1000 835" fill="none" stroke="#d32f2f" stroke-width="2" />

  <!-- Нули с изолированной шины N2 -->
  <path d="M 825 617 L 795 617 L 795 835" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M 875 617 L 850 617 L 850 835" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M 925 617 L 905 617 L 905 835" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M 980 617 L 960 617 L 960 835" fill="none" stroke="#0288d1" stroke-width="2" />
  <path d="M 1040 617 L 1015 617 L 1015 835" fill="none" stroke="#0288d1" stroke-width="2" />

  <!-- Заземление с шины PE -->
  <path d="M 800 762 L 810 762 L 810 835" fill="none" stroke="#fbc02d" stroke-width="2" stroke-dasharray="4, 2" />
