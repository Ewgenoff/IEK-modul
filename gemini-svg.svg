    <text x="400" y="97" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">ОБЩАЯ ШИНА N (ВВОДНАЯ)</text>
    <circle cx="310" cy="92" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="340" cy="92" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="430" cy="92" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="480" cy="92" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
  </g>

  <!-- ИЗОЛИРОВАННАЯ ШИНА N2 (после УЗО 2) -->
