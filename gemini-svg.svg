<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="100%" height="100%" style="background:#16181d; font-family: &#39;Segoe UI&#39;, Arial, sans-serif;">
  <defs>
    <!-- Металл DIN-рейки -->
    <linearGradient id="din" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#607d8b" />
      <stop offset="25%" stop-color="#b0bec5" />
      <stop offset="50%" stop-color="#78909c" />
      <stop offset="75%" stop-color="#b0bec5" />
      <stop offset="100%" stop-color="#455a64" />
    </linearGradient>
    
    <!-- Тень модулей -->
    <filter id="shadow" x="-5%" y="-5%" width="112%" height="112%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Заголовок -->
  <text x="600" y="38" fill="#eceff1" font-size="21" font-weight="bold" text-anchor="middle" letter-spacing="0.5">СХЕМА ЩИТКА (БЕЗ ПЕРЕСЕЧЕНИЙ ЛИНИЙ И НАЛОЖЕНИЙ)</text>

  <!-- DIN-РЕЙКА -->
  <rect x="70" y="350" width="1080" height="46" rx="3" fill="url(#din)" stroke="#263238" stroke-width="1.5" />
  <line x1="70" y1="356" x2="1150" y2="356" stroke="#37474f" stroke-width="2" />
  <line x1="70" y1="390" x2="1150" y2="390" stroke="#37474f" stroke-width="2" />

  <!-- ==================== ШИНЫ ==================== -->

  <!-- ОБЩАЯ ШИНА N (Вводная) -->
