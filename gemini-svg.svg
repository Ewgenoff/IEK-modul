    <circle cx="875" cy="617" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="925" cy="617" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="980" cy="617" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="1040" cy="617" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
