    <circle cx="480" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="800" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="855" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="910" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="965" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
    <circle cx="1020" cy="762" r="5" fill="#eceff1" stroke="#263238" stroke-width="1.5" />
