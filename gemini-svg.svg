    <text x="127" y="325" font-size="11" font-weight="bold" fill="#212121" text-anchor="middle">ВВОД 2P</text>
    <text x="127" y="415" font-size="9" fill="#546e7a" text-anchor="middle">C40 / C50</text>
    <circle cx="108" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
    <circle cx="146" cy="295" r="6" fill="#b0bec5" stroke="#37474f" />
    <text x="108" y="287" font-size="9" font-weight="bold" fill="#c62828" text-anchor="middle">L</text>
    <text x="146" y="287" font-size="9" font-weight="bold" fill="#1565c0" text-anchor="middle">N</text>
    <circle cx="108" cy="445" r="6" fill="#b0bec5" stroke="#37474f" />
    <circle cx="146" cy="445" r="6" fill="#b0bec5" stroke="#37474f" />
  </g>

  <!-- 2. РЕЛЕ НАПРЯЖЕНИЯ РН-263t (x: 230..315) -->
  <g filter="url(#shadow)">
    <rect x="230" y="270" width="85" height="200" rx="5" fill="#eceff1" stroke="#37474f" stroke-width="1.8" />
    <rect x="242" y="325" width="60" height="32" rx="3" fill="#111111" />
    <text x="272" y="348" font-size="17" font-weight="bold" fill="#00e676" text-anchor="middle" font-family="monospace">230</text>
    <text x="272" y="305" font-size="11" font-weight="bold" fill="#0d47a1" text-anchor="middle">РН-263t</text>
    <text x="272" y="375" font-size="8" fill="#546e7a" text-anchor="middle">Новатек</text>
    <!-- Клемма 1 (L вход) -->
